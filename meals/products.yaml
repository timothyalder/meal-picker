# Ingredient name -> what to buy. Keys are matched after common.norm_name (lower case, no
# punctuation). Format and fields: products.example.yaml. TJ's to correct.
#
# Drafted 2026-11-16 from the first 30 pool recipes' ingredient names and the 2026-11-11 price
# snapshot (Aldi Chisholm, Woolworths via hotprices). Ids are store product ids; a list means
# "any of these, whichever is cheapest for the amount" (meat by price per kg, since leftovers
# are frozen; everything else by checkout cost).
#
# Conversions (each_g, ml_per_g, count_per_pack) are rough kitchen figures: a cup is 250 ml,
# so ml_per_g = 250 / grams in a cup.
#
# New names from later crawls: .venv/bin/python shopping/meals/shortlist.py --unmapped

# --- Pantry: always in the cupboard, costs nothing, never on the list ----------------------
